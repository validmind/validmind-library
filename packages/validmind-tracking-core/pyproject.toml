[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "validmind-tracking-core"
version = "0.1.0"
description = "Dependency-light authentication and tracking transport for ValidMind SDKs"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = { text = "AGPL-3.0 AND ValidMind Commercial" }
dependencies = [
  "requests (>=2.28.0,<3.0.0)",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/validmind_tracking_core"]
