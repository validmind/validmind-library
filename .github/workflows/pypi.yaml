# This workflow pushes the ValidMind Library package to PyPI when a tag is created.
# The validmind-tracking-core package must be published first; the job checks this.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Update twine
        run: uv pip install --upgrade twine

      - name: Check validmind-tracking-core is on PyPI
        # validmind depends on validmind-tracking-core; publishing before that
        # version exists would ship an uninstallable wheel. Publish it first by
        # pushing a tracking-core-v* tag.
        run: |
          SPEC=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'] if d.startswith('validmind-tracking-core')).replace(' ', ''))")
          echo "Resolving ${SPEC} from PyPI"
          python -m pip download --no-deps --dest /tmp/tracking-core-check "${SPEC}"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
        run: |
          uv build
          uv publish
